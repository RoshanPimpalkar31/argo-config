apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cd-deploy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RoshanPimpalkar31/app-test-helm.git
    targetRevision: HEAD
    path: cd-deploy
    helm:
      releaseName: app
  destination:
    server: https://kubernetes.default.svc
    namespace: kt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
